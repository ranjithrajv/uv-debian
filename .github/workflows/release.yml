name: Build uv for Debian

on:
  workflow_dispatch:
    inputs:
      uv_version:
        description: The version of uv to build.
        type: string
        required: true
      build_version:
        description: The build version.
        type: string
        required: true
      architecture:
        description: Architecture to build (amd64, arm64, armel, armhf, ppc64el, s390x, riscv64, or 'all' for all architectures)
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'amd64'
          - 'arm64'
          - 'armel'
          - 'armhf'
          - 'ppc64el'
          - 's390x'
          - 'riscv64'
      enable_lintian:
        description: Enable lintian validation
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-uv:
    name: Build
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout uv-debian
        uses: actions/checkout@v4

      - name: Build uv
        uses: ranjithrajv/debian-multiarch-builder@main
        with:
          config-file: 'package.yaml'
          version: ${{ inputs.uv_version }}
          build-version: ${{ inputs.build_version }}
          architecture: ${{ inputs.architecture }}
          lintian-check: ${{ inputs.enable_lintian }}

      - name: Display build summary
        if: always()
        run: |
          echo "=== Build Summary ==="
          if [ -f build-summary.json ]; then
            cat build-summary.json | jq '.'
          else
            echo "No build-summary.json found"
          fi

      - name: Display lintian results
        if: inputs.enable_lintian && always()
        run: |
          echo "=== Lintian Results ==="
          if [ -f build-summary.json ]; then
            cat build-summary.json | jq '.lintian'
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: uv_*.deb


  release-uv:
    name: (Draft-)Release uv for Debian
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-uv
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifact

      - name: Publish Release Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: uv_*.deb
          name: ${{ inputs.uv_version }}+${{ inputs.build_version }}
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
